# Tests the app on pushes to master and publishes it to GitHub Pages if the tests pass.
# Free for public repositories. Can also be started by hand in the Actions tab.
# One-time setup: repository Settings -> Pages -> Source: "GitHub Actions".
name: Test and publish

on:
  push:
    branches: [master]
  workflow_dispatch:

# runs one after the other, so a deployment is never cut off by a newer push
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  web:
    name: Checks, unit and browser tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      # Firefox and WebKit (as on the iPhone) in Playwright's Docker image, exactly as run locally
      # (npm run test:e2e); also builds the app as published (dist-pages) and tests that build
      - run: sh scripts/test-e2e.sh
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: tests/e2e-results/
          retention-days: 7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist-pages

  desktop:
    name: Desktop app (Rust tests)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # from https://v2.tauri.app/start/prerequisites/ (Debian/Ubuntu)
      - name: Install Tauri's system libraries
        run: >-
          sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file
          libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      # the Rust build embeds the built web app
      - run: npm ci && npm run build
      - run: cargo test
        working-directory: src-tauri
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri

  # only the web app's tests gate publishing: a desktop (Rust) problem shouldn't keep fixes from the phone
  publish:
    name: Publish to GitHub Pages
    needs: web
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
